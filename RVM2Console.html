<script>
window.RVM_FIREBASE_CONFIG = {
  apiKey: "AIzaSyCRDkusyC05EzBiT8ZBj8JpZd8E5qVd-4g",
  authDomain: "rvm-software-manifest.firebaseapp.com",
  databaseURL: "https://rvm-software-manifest-default-rtdb.firebaseio.com",
  projectId: "rvm-software-manifest",
  storageBucket: "rvm-software-manifest.firebasestorage.app",
  messagingSenderId: "246377591660",
  appId: "1:246377591660:web:459adf1087bd84ca36b949",
  measurementId: "G-NH6DZ0S23K"
};
if(!firebase.apps.length){ firebase.initializeApp(window.RVM_FIREBASE_CONFIG); }
window.rvm_db = firebase.firestore();
window.rvm_rtdb = firebase.database();
window.rvm_pushBus = function(bus){
  try{
    const id = bus.id || bus.busNum;
    const payload = {
      id: id,
      busNumber: bus.busNum || bus.busNumber || id,
      number: bus.busNum || bus.busNumber || id,
      route: bus.route || bus.assignedRoute || 'Not Assigned',
      model: bus.model || '',
      status: 'in_service',
      lat: bus.lat || 41.12 + (Math.random()-0.5)*0.1,
      lng: bus.lng || -87.86 + (Math.random()-0.5)*0.1,
      driver: bus.driver || '',
      capacity: bus.capacity || 32,
      imei: bus.imei || '',
      timestamp: Date.now(),
      assignedAt: new Date().toISOString()
    };
    // Firestore
    window.rvm_db.collection('buses').doc(String(id)).set(payload, {merge:true});
    // RTDB
    window.rvm_rtdb.ref('buses/'+String(id)).set(payload);
    console.log('[DISPATCH BRIDGE] Pushed bus to Firebase', id, payload);
  }catch(e){ console.error('Bridge push failed', e); }
};
window.rvm_removeBus = function(id){
  try{
    window.rvm_db.collection('buses').doc(String(id)).set({status:'offline', id:String(id), timestamp:Date.now()}, {merge:true});
    window.rvm_rtdb.ref('buses/'+String(id)).remove();
    console.log('[DISPATCH BRIDGE] Removed bus', id);
  }catch(e){ console.error(e); }
};

<style id="splash-style">
#rvt-splash{
  position:fixed;inset:0;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background: 
    radial-gradient(1200px 800px at 15% 15%, rgba(0,119,200,0.35) 0%, transparent 60%),
    radial-gradient(900px 600px at 85% 85%, rgba(255,255,255,0.55) 0%, transparent 55%),
    linear-gradient(135deg, #06111f 0%, #0a1e3a 18%, #0f3a6e 42%, #eef3f9 78%, #ffffff 85%, #0a0a0a 100%);
  background-color:#060e1c;
  transition:opacity 1000ms cubic-bezier(.4,0,.2,1), transform 1000ms cubic-bezier(.4,0,.2,1);
  overflow:hidden;
}
#rvt-splash::before{
  content:"";
  position:absolute;inset:-50%;
  background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,0.18) 40%, rgba(255,255,255,0.08) 50%, transparent 70%);
  transform: translateX(-60%) skewX(-12deg);
  animation: rvtShimmer 2.8s ease-in-out infinite;
}
#rvt-splash.rvt-hide{opacity:0;transform:scale(1.04);pointer-events:none;visibility:hidden;}

.rvt-glass-wrap{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;
  padding:42px 48px 36px;
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(24px) saturate(1.3);
  -webkit-backdrop-filter: blur(24px) saturate(1.3);
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: 28px;
  box-shadow: 
    0 20px 80px rgba(0,0,0,0.18),
    0 1px 0 rgba(255,255,255,0.9) inset,
    0 0 0 1px rgba(255,255,255,0.3) inset;
  animation: rvtFloat 3s ease-in-out infinite;
}
.rvt-glass-wrap img{
  width:min(340px,68vw);height:auto;object-fit:contain;
  filter: drop-shadow(0 8px 24px rgba(0,0,0,.08));
}
.rvt-meta{
  margin-top:18px;
  text-align:center;
}
.rvt-title{
  font-family:Inter,ui-sans-serif,system-ui;
  font-weight:800;letter-spacing:-0.03em;
  font-size:13px;text-transform:uppercase;
  color:#0a0a0a;
  opacity:.9;
}
.rvt-sub{
  margin-top:4px;
  font-family:Inter,ui-sans-serif,system-ui;
  font-weight:500;letter-spacing:-0.01em;
  font-size:12px;color:#5a5a5a;
}
.rvt-loader-track{
  margin-top:26px;
  width:120px;height:3px;
  background: rgba(10,10,10,0.08);
  border-radius:999px;overflow:hidden;
  position:relative;
}
.rvt-loader-bar{
  position:absolute;left:0;top:0;bottom:0;width:40%;
  background: linear-gradient(90deg, #0a0a0a, #0077c8);
  border-radius:999px;
  animation: rvtLoad 1.3s cubic-bezier(.4,0,.2,1) infinite;
}
.rvt-orbs{position:absolute;inset:0;pointer-events:none;}
.rvt-orbs span{
  position:absolute;border-radius:50%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.1));
  backdrop-filter: blur(12px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
}
.rvt-orbs span:nth-child(1){width:180px;height:180px;left:8%;top:12%;background:radial-gradient(circle at 30% 30%, rgba(0,119,200,0.35), rgba(0,119,200,0.05));animation:rvtDrift1 8s ease-in-out infinite;}
.rvt-orbs span:nth-child(2){width:260px;height:260px;right:6%;bottom:14%;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.15));animation:rvtDrift2 9s ease-in-out infinite;}
.rvt-orbs span:nth-child(3){width:90px;height:90px;left:50%;top:8%;background:radial-gradient(circle at 30% 30%, rgba(10,10,10,0.15), rgba(10,10,10,0.02));animation:rvtDrift1 7s ease-in-out infinite reverse;}

@keyframes rvtLoad{0%{transform:translateX(-100%)}50%{transform:translateX(60%)}100%{transform:translateX(220%)}}
@keyframes rvtFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes rvtShimmer{0%{transform:translateX(-70%) skewX(-12deg)}50%{transform:translateX(30%) skewX(-12deg)}100%{transform:translateX(120%) skewX(-12deg)}}
@keyframes rvtDrift1{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-18px)}}
@keyframes rvtDrift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-18px,16px)}}
</style>


<style id="theme-style">
/* Theme System - lite/dim/dark */
html[data-theme="lite"]{color-scheme:light;}
html[data-theme="dim"]{color-scheme:dark;}
html[data-theme="dark"]{color-scheme:dark;}

/* lite is default - no overrides */

html[data-theme="dim"] body,
html[data-theme="dim"] #root > div{min-height:100vh;background:#1e1e1f !important;}
html[data-theme="dim"] .bg-\[\#f7f7f5\]{background:#1e1e1f !important;}
html[data-theme="dim"] .bg-\[\#fcfcfc\]{background:#1a1a1b !important;}
html[data-theme="dim"] .bg-white{background:#262628 !important;}
html[data-theme="dim"] .bg-\[\#f9f9f7\]{background:#2a2a2c !important;}
html[data-theme="dim"] .bg-\[\#fafaf8\]{background:#2a2a2c !important;}
html[data-theme="dim"] .border-\[\#e8e8e8\]{border-color:#333336 !important;}
html[data-theme="dim"] .border-\[\#e0e0e0\]{border-color:#3a3a3e !important;}
html[data-theme="dim"] .border-\[\#f0f0f0\]{border-color:#2f2f33 !important;}
html[data-theme="dim"] .border-\[\#e5e5e5\]{border-color:#333336 !important;}
html[data-theme="dim"] .border-\[\#f5f5f5\]{border-color:#2f2f33 !important;}
html[data-theme="dim"] .text-\[\#0a0a0a\]{color:#f1f1f2 !important;}
html[data-theme="dim"] .text-\[\#5a5a5a\]{color:#a1a1a6 !important;}
html[data-theme="dim"] .text-\[\#6a6a6a\]{color:#9a9aa0 !important;}
html[data-theme="dim"] .text-\[\#6b6b6b\]{color:#9a9aa0 !important;}
html[data-theme="dim"] .text-\[\#8a8a8a\]{color:#8a8a90 !important;}
html[data-theme="dim"] .text-\[\#9a9a9a\]{color:#7a7a80 !important;}

html[data-theme="dark"] body,
html[data-theme="dark"] #root > div{min-height:100vh;background:#0a0a0a !important;}
html[data-theme="dark"] .bg-\[\#f7f7f5\]{background:#0a0a0a !important;}
html[data-theme="dark"] .bg-\[\#fcfcfc\]{background:#0a0a0a !important;}
html[data-theme="dark"] .bg-white{background:#171717 !important;}
html[data-theme="dark"] .bg-\[\#f9f9f7\]{background:#1e1e1e !important;}
html[data-theme="dark"] .bg-\[\#fafaf8\]{background:#1e1e1e !important;}
html[data-theme="dark"] .bg-\[\#0a0a0a\]{background:#f5f5f5 !important;color:#0a0a0a !important;}
html[data-theme="dark"] .border-\[\#e8e8e8\]{border-color:#262626 !important;}
html[data-theme="dark"] .border-\[\#e0e0e0\]{border-color:#2e2e2e !important;}
html[data-theme="dark"] .border-\[\#f0f0f0\]{border-color:#1e1e1e !important;}
html[data-theme="dark"] .border-\[\#e5e5e5\]{border-color:#262626 !important;}
html[data-theme="dark"] .border-\[\#f5f5f5\]{border-color:#1e1e1e !important;}
html[data-theme="dark"] .text-\[\#0a0a0a\]{color:#f5f5f5 !important;}
html[data-theme="dark"] .text-\[\#5a5a5a\]{color:#a3a3a3 !important;}
html[data-theme="dark"] .text-\[\#6a6a6a\]{color:#999 !important;}
html[data-theme="dark"] .text-\[\#6b6b6b\]{color:#999 !important;}
html[data-theme="dark"] .text-\[\#8a8a8a\]{color:#888 !important;}
html[data-theme="dark"] .text-\[\#9a9a9a\]{color:#777 !important;}
html[data-theme="dark"] input, html[data-theme="dark"] select, html[data-theme="dark"] textarea{
  background:#1e1e1e !important;color:#f5f5f5 !important;border-color:#2e2e2e !important;
}
html[data-theme="dim"] input, html[data-theme="dim"] select, html[data-theme="dim"] textarea{
  background:#2a2a2c !important;color:#f1f1f2 !important;border-color:#3a3a3e !important;
}
html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#333 !important;}
html[data-theme="dim"] ::-webkit-scrollbar-thumb{background:#3a3a3e !important;}

.rvm-theme-switch{display:flex;align-items:center;gap:2px;background:#f0f0f0;border-radius:10px;padding:3px;border:1px solid #e5e5e5;}
html[data-theme="dim"] .rvm-theme-switch{background:#2a2a2c;border-color:#3a3a3e;}
html[data-theme="dark"] .rvm-theme-switch{background:#1e1e1e;border-color:#262626;}
.rvm-theme-btn{height:26px;padding:0 10px;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;transition:all .15s;color:#6a6a6a;}
.rvm-theme-btn.active{background:#0a0a0a;color:white;box-shadow:0 1px 4px rgba(0,0,0,.15);}
html[data-theme="dim"] .rvm-theme-btn.active{background:#f1f1f2;color:#0a0a0a;}
html[data-theme="dark"] .rvm-theme-btn.active{background:#f5f5f5;color:#0a0a0a;}
.rvm-theme-btn:not(.active):hover{color:#0a0a0a;background:rgba(0,0,0,.06);}
html[data-theme="dim"] .rvm-theme-btn:not(.active):hover, html[data-theme="dark"] .rvm-theme-btn:not(.active):hover{background:rgba(255,255,255,.08);color:#f5f5f5;}
</style>
