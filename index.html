<style>
#rvm-toast-container{position:fixed;top:20px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.rvm-toast{background:#0a0a0a;color:#fff;padding:14px 18px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.35);transform:translateX(120%);animation:rvmSlideIn .4s forwards;min-width:300px;pointer-events:auto;border:1px solid #27272a}
.rvm-toast b{color:#10b981}
@keyframes rvmSlideIn{to{transform:translateX(0)}}
@keyframes rvmSlideOut{to{transform:translateX(120%);opacity:0}}
</style>
<div id="rvm-toast-container"></div>
<script>
window.rvm_showBusPopup = function(bus){
  try{
    const c=document.getElementById('rvm-toast-container');
    if(!c) return;
    const el=document.createElement('div');
    el.className='rvm-toast';
    const busNum = bus.busNumber || bus.busNum || bus.number || bus.id;
    const route = bus.route || bus.assignedRoute || bus.routeName || 'Not Assigned';
    el.innerHTML = `🚌 <b>Bus ${busNum}</b> is now online!<br><span style="font-size:12px;opacity:.8">Route: ${route} • ${new Date().toLocaleTimeString()}</span>`;
    c.appendChild(el);
    try{ const a=new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg'); a.volume=0.35; a.play().catch(()=>{});}catch(e){}
    setTimeout(()=>{ el.style.animation='rvmSlideOut .4s forwards'; setTimeout(()=>el.remove(),400); }, 6000);
  }catch(e){console.error(e)}
};
</script>
